name: Custom image

on:
  push:
    tags:
      - 'v*.custom.*'
      - 'v*-custom.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref_name }}
  cancel-in-progress: false

# Builds and pushes the fork image. Tag scheme, module signing and image
# names: FORK.md, "Versions and release".

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag commit is on origin/custom
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/custom:refs/remotes/origin/custom'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/custom || { echo "::error::$TAG points at a commit that is not on origin/custom"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Version from the tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-(((beta|rc)\.[1-9][0-9]*\.)?custom\.[1-9][0-9]*)$ ]] || { echo "::error::$TAG is not vX.Y.Z-beta.N.custom.M or vX.Y.Z-custom.M"; exit 1; }
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'api/package.json', 'client/package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = process.argv[1];
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
          " "$version"
          grep -H '"version"' package.json api/package.json client/package.json
          # The license line date is the day the upstream vX.Y.0 came out,
          # when that tag is here; otherwise the build day is used.
          line_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          line_date=""
          if git rev-parse -q --verify "refs/tags/$line_tag" > /dev/null; then
            line_date=$(TZ=UTC git for-each-ref --format='%(creatordate:format-local:%Y-%m-%d)' "refs/tags/$line_tag")
          fi
          echo "line_release_date=${line_date}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck (ratchet)
        run: yarn typecheck:ratchet

      - name: Build the module snapshot (CS2)
        shell: bash
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$MODULE_SIGNING_KEY" ]; then
            bash scripts/build-module-snapshot.sh --unsigned
            node scripts/sign-module.mjs --snapshot api/bundled-modules
          else
            bash scripts/build-module-snapshot.sh --ephemeral | tee "$RUNNER_TEMP/snapshot.log"
            key=$(sed -n 's/^MODULE_TRUSTED_KEYS=//p' "$RUNNER_TEMP/snapshot.log")
            echo "No MODULE_SIGNING_KEY secret: signed with a throwaway key. Set MODULE_TRUSTED_KEYS=${key} on instances that run this image." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            AT_LINE_RELEASE_DATE=${{ steps.version.outputs.line_release_date }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auto-tournament:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/auto-tournament:custom
          cache-from: type=gha,scope=custom-amd64
          cache-to: type=gha,scope=custom-amd64,mode=max
